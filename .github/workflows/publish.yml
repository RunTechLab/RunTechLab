name: Update RunTech Lab site

on:
  push:
    branches:
      - main
    paths:
      - "articoli/**"
      - "immagini/**"
      - "publish_article.py"
      - ".github/workflows/publish.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update homepage, sitemap and analytics
        run: python publish_article.py --ci

      - name: Commit generated files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add index.html sitemap.xml articoli/*.html output/report/pubblicazione.txt
          git diff --cached --quiet || git commit -m "Aggiorna homepage sitemap e analytics"
          git push
